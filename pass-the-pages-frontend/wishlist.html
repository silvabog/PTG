<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Wishlist - Book Swap</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Enable dropdown on hover */
ul.dropdown-content {
display: none;
opacity: 0;
visibility: hidden;
transition: opacity 0.3s ease, visibility 0s linear 0.3s; /* Smooth transition */
}

/* Show the dropdown when hovering over the trigger */
.dropdown-trigger:hover + .dropdown-content,
.dropdown-content:hover {
display: block !important;
opacity: 1;
visibility: visible;
transition: opacity 0.3s ease, visibility 0s linear 0s; /* Transition in */
}

/* Position the dropdown under the 'My Account' button */
.dropdown-content {
left: auto !important;  /* Align the dropdown to the left of the trigger */
right: -80px !important;  /* Disable default right alignment */
top: 100% !important;  /* Position it just below the trigger */
} 
  </style>
</head>
<body>
  <!-- Navbar (Dynamically Loaded) -->
  <div id="navbar-container"></div>

  <div class="container">
    <h3 class="center-align">My Wishlist</h3>

    <ul class="collection" id="wishlist">
      <!-- Wishlist items will be added dynamically -->
    </ul>

    <div class="input-field">
      <input type="text" id="wishlistInput" placeholder="Add a book to your wishlist" />
      <button class="btn blue" onclick="addToWishlist()">Add</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      fetch("navbar.html")
        .then(res => res.text())
        .then(data => {
          document.getElementById("navbar-container").innerHTML = data;
          M.Sidenav.init(document.querySelectorAll(".sidenav"));
        });

      loadWishlist();
    });

    function loadWishlist() {
      const wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
      const list = document.getElementById("wishlist");
      list.innerHTML = "";

      wishlist.forEach((book, index) => {
        const item = document.createElement("li");
        item.className = "collection-item";
        item.innerHTML = `${book} <a href="#!" class="secondary-content red-text" onclick="removeWishlistItem(${index})"><i class="material-icons">delete</i></a>`;
        list.appendChild(item);
      });
    }

    function addToWishlist() {
      const input = document.getElementById("wishlistInput");
      const book = input.value.trim();
      if (book !== "") {
        const wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
        wishlist.push(book);
        localStorage.setItem("wishlist", JSON.stringify(wishlist));
        input.value = "";
        loadWishlist();
      }
    }

    function removeWishlistItem(index) {
      const wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
      wishlist.splice(index, 1);
      localStorage.setItem("wishlist", JSON.stringify(wishlist));
      loadWishlist();
    }
  </script>

  
</body>
</html>
